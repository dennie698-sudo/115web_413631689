<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
</head>

<body>
  <!-- header：網頁頁首區域 -->
  <header>
    <h1>我的個人網站</h1>
    <nav>
      <!-- 本機頁面連結 -->
      <a href="index.html">首頁</a> |
      <a href="about.html">關於我</a> |
      <!-- 外部連結 -->
      <a href="https://www.tku.edu.tw/" target="_blank" rel="noreferrer">淡江大學</a>
    </nav>
  </header>

  <hr>

  <!-- main：網頁主要內容 -->
  <main>
    <!-- section 1：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>
      <!-- 個人照片（請確保資料夾內有一張 profile.jpg） -->
      <img src="profile.jpg" alt="龍貓" width="200">
      
      <p>
        大家好！我是淡江大學資訊管理學系3C的李岳融，目前正在修讀網路程式設計課程。
      </p>
      <p>
        在大學期間，我除了專注於資管專業課程外，也非常喜歡探索 <strong>網頁前端技術</strong> 與 <em>程式開發實作</em>。
      </p>
    </section>

    <!-- section 2：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>
      <ul>
        <li>音樂</li>
        <li>電影</li>
        <li>遊戲</li>
      </ul>
    </section>

    <!-- section 3：學習步驟區域 -->
    <section>
      <h2>學習網頁的步驟</h2>
      <ol>
        <li>學習 HTML</li>
        <li>學習 CSS</li>
        <li>學習 JavaScript</li>
      </ol>
    </section>

    <!-- section 4：課程表格區域（至少三列資料） -->
    <section>
      <h2>課程進度</h2>
      <table border="1" cellpadding="8" cellspacing="0">
        <caption>網路程式設計課程</caption>
        <thead>
          <tr>
            <th scope="col">週次</th>
            <th scope="col">課程主題</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Week 1</td>
            <td>GitHub 與開發環境</td>
          </tr>
          <tr>
            <td>Week 2</td>
            <td>Git 基礎</td>
          </tr>
          <tr>
            <td>Week 3</td>
            <td>HTML 網頁基礎</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <hr>

  <!-- footer：網頁頁尾區域 -->
  <footer>
    <p>© 2026 我的個人網站</p>
  </footer>
</body>

</html>
